# ============================================================================
#  S-DOWNLOAD MANAGER (SDM)
#  .github/workflows/build-linux.yml
#
#  Compila con GCC en Ubuntu, ejecuta CTest y genera un tarball portable
#  con el desempaquetador de escritorio, iconos y script del puente nativo.
#  En tags v* publica los artefactos en el GitHub Release.
# ============================================================================
name: Build Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: "6.7.3"

jobs:
  build:
    name: Compilar + portable
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libcurl4-openssl-dev libsqlite3-dev \
            nlohmann-json3-dev libfmt-dev \
            libgl1-mesa-dev libxkbcommon-dev libfontconfig1 \
            libdbus-1-3 libicu-dev

      - name: Instalar Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets
          cache: true

      - name: Configurar
        run: cmake --preset release

      - name: Compilar
        run: cmake --build --preset release --parallel

      - name: Pruebas (CTest)
        run: ctest --preset release

      - name: Instalar en dist/linux
        run: |
          cmake --install build/release --prefix "dist/linux/SDM-1.0.0"
          # El script resuelve las plantillas via ../native-host -> misma estructura
          mkdir -p "dist/linux/SDM-1.0.0/packaging/linux"
          cp packaging/linux/install-native-host.sh \
             "dist/linux/SDM-1.0.0/packaging/linux/"
          cp -r packaging/native-host \
             "dist/linux/SDM-1.0.0/packaging/"
          chmod +x "dist/linux/SDM-1.0.0/packaging/linux/install-native-host.sh"

      - name: Iconos de la extension
        run: python3 tools/generate_icons.py

      - name: Tarball portable
        run: |
          tar -czf dist/sdm-linux-x86_64.tar.gz \
            -C dist/linux "SDM-1.0.0"

      - name: Checksums SHA-256
        run: |
          cd dist
          sha256sum sdm-linux-x86_64.tar.gz > SHA256SUMS-LINUX.txt
          cat SHA256SUMS-LINUX.txt

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: sdm-linux
          path: |
            dist/sdm-linux-x86_64.tar.gz
            dist/SHA256SUMS-LINUX.txt

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sdm-linux-x86_64.tar.gz
            dist/SHA256SUMS-LINUX.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
